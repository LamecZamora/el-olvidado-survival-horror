# Rojo Configuration - El Olvidado Survival Horror
# Usa este archivo para desarrollo con sincronización en tiempo real

name: "El Olvidado - Development"
servePort: 34872
serveAddress: 0.0.0.0

# Límites de sincronización
globResolution: 64

# Árbol de instancias
tree:
  ReplicatedStorage:
    $className: ReplicatedStorage
    $path: src/ReplicatedStorage

  ServerScriptService:
    $className: ServerScriptService
    $path: src/ServerScriptService

  StarterPlayer:
    $className: StarterPlayer
    StarterPlayerScripts:
      $className: StarterPlayerScripts
      $path: src/StarterPlayer/StarterPlayerScripts
    StarterCharacterScripts:
      $className: StarterCharacterScripts
      $path: src/StarterPlayer/StarterCharacterScripts

  Workspace:
    $className: Workspace
    $path: src/Workspace

  Lighting:
    $className: Lighting
    $path: src/Lighting
    $properties:
      Technology: Voxels
      Brightness: 1
      ClockTime: 0
      EnvironmentalDiffuseScale: 0
      Ambient: rgb(20, 20, 30)

  SoundService:
    $className: SoundService
    $path: src/SoundService

  ServerStorage:
    $className: ServerStorage
    $path: src/ServerStorage

  Chat:
    $className: Chat
    $properties:
      ChatEnabled: false
